name: vieting
description: "VieTing - app quản lý chi tiêu, tự đọc thông báo biến động số dư ngân hàng."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.4
  http: ^1.2.2
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFF8EC"
  adaptive_icon_background: "#FFF8EC"
  adaptive_icon_foreground: "assets/branding/icon-foreground.png"
  windows:
    generate: true
    image_path: "assets/branding/icon.png"
    icon_size: 256
